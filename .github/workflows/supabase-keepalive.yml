name: Supabase FR database keepalive
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query the database through FR gateway
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 25 \
            https://frengenhariacivil.com.br/api/health/db \
            | grep -q '"ok":true'
